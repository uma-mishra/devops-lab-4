services:
  app:
    build: .
    container_name: lab4-devops-app
    ports:
      - "5001:5000"
    environment:
      APP_VERSION: "1.0.0"
      APP_ENV: "production"
      SECRET_KEY: "${SECRET_KEY}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
