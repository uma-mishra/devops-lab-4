services:
  blue:
    build: .
    environment:
      APP_VERSION: "1.0.0"
      APP_ENV: "blue"
    expose:
      - "5000"
    restart: unless-stopped

  green:
    build: .
    environment:
      APP_VERSION: "2.0.0"
      APP_ENV: "green"
    expose:
      - "5000"
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green
    restart: unless-stopped
