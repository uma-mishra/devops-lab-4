apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab4-devops-app
  namespace: lab4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab4-devops-app
  template:
    metadata:
      labels:
        app: lab4-devops-app
    spec:
      containers:
        - name: app
          image: lab4-advanced-devops-app:latest
          imagePullPolicy: Never
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lab4-app-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab4-app-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
